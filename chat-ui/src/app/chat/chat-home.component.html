<div class="app" [class.conversation-open]="conversationOpen()">
  <header class="topbar">
    <strong>Real-Time Chat</strong>
    <span class="spacer"></span>
    <span class="status" [attr.data-state]="socket.state()" [title]="'Connection: ' + socket.state()">
      <i></i>{{ socket.state() }}
    </span>
    <span class="me">{{ auth.profile()?.displayName }}</span>
    <button type="button" (click)="logout()">Sign out</button>
  </header>

  <div class="layout">
    <aside>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'chats'" [class.on]="tab() === 'chats'" (click)="tab.set('chats')">Chats</button>
        <button type="button" role="tab" [attr.aria-selected]="tab() === 'people'" [class.on]="tab() === 'people'" (click)="tab.set('people')">People</button>
      </div>
      <div class="scroll">
        @if (openError()) {
          <p class="open-error" role="alert">{{ openError() }}</p>
        }
        @if (tab() === 'chats') {
          <app-conversation-list />
        } @else {
          <app-user-directory (userSelected)="startChat($event)" />
        }
      </div>
    </aside>

    <section class="main">
      <router-outlet />
    </section>
  </div>
</div>
