<main class="shell">
  <header>
    <div>
      <span class="eyebrow">Signed in</span>
      <h1>{{ auth.profile()?.displayName }}</h1>
      <p>{{ auth.profile()?.email }}</p>
    </div>
    <button type="button" (click)="logout()">Sign out</button>
  </header>

  <section class="panel">
    <h2>Connection</h2>
    <span class="status" [attr.data-state]="socket.state()">{{ socket.state() }}</span>
  </section>

  <section class="panel">
    <h2>People</h2>
    <app-user-directory (userSelected)="selected.set($event)" />
    @if (selected(); as user) {
      <p class="hint">Selected {{ user.displayName }} — starting conversations arrives in the next phase.</p>
    }
  </section>
</main>
