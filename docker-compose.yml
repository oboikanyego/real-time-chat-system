services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./chat-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/realtime_chat
      CLIENT_ORIGIN: http://localhost:4200
      AUTH_MODE: development
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  ui:
    build:
      context: ./chat-ui
      dockerfile: Dockerfile
      args:
        CHAT_API_URL: http://localhost:3000
        CHAT_SOCKET_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mongo-data:
