name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ui:
    name: UI (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-ui/package-lock.json
      - run: npm ci
      - run: npm run build:docker # same build as the Docker image (development login, no Firebase needed)

  integration:
    name: Integration (API + real MongoDB)
    runs-on: ubuntu-latest
    needs: api
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: chat-api
    env:
      API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-api/package-lock.json
      - run: npm ci
      - name: Start the API
        run: |
          npx tsx src/server.ts > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs "$API_URL/ready" >/dev/null && exit 0; sleep 1; done
          echo "API did not become ready"; cat api.log; exit 1
        env:
          MONGODB_URI: mongodb://localhost:27017/chat_ci
          AUTH_MODE: development
          NODE_ENV: development
          PRESENCE_GRACE_MS: "400"
          LOG_LEVEL: warn
      - run: npm run test:integration
      - name: API log
        if: failure()
        run: cat api.log

  docker:
    name: Docker (build images, compose stack)
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the stack from outside
        run: |
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ready
          curl -fs http://localhost:4200/healthz
          curl -fsI http://localhost:4200/ | grep -i '^content-security-policy'
          curl -fs -o /dev/null -w 'deep link: %{http_code}\n' http://localhost:4200/chat/abc
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
